<form nz-form [formGroup]="frmGroup">
  <div class="row">
    <div class="col-12">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="email"
          >E-mail</nz-form-label
        >
        <nz-form-control
          [nzSm]="16"
          [nzXs]="24"
          nzErrorTip="Vui lòng nhập thông tin!"
        >
          <input nz-input formControlName="email" id="email" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="password" nzRequired
          >Password</nz-form-label
        >
        <nz-form-control
          [nzSm]="16"
          [nzXs]="24"
          nzErrorTip="Vui lòng nhập thông tin!"
        >
          <input
            nz-input
            type="password"
            id="password"
            formControlName="password"
          />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="passwordConfirm" nzRequired
          >Confirm Password</nz-form-label
        >
        <nz-form-control
          [nzSm]="16"
          [nzXs]="24"
          nzErrorTip="Vui lòng nhập thông tin!"
        >
          <input nz-input formControlName="passwordConfirm" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="role" nzRequired
          >Quyền</nz-form-label
        >
        <nz-form-control
          [nzSm]="16"
          [nzXs]="24"
          nzErrorTip="Vui lòng chọn quyền!"
        >
          <nz-select
            nzShowSearch
            nzAllowClear
            nzPlaceHolder="--chọn--"
            formControlName="role"
          >
            <nz-option nzLabel="Jack" nzValue="jack"></nz-option>
            <nz-option nzLabel="Lucy" nzValue="lucy"></nz-option>
            <nz-option nzLabel="Tom" nzValue="tom"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <nz-form-control [nzSm]="16" [nzXs]="24" [nzOffset]="8">
        <button class="me-1" nz-button nzType="primary" (click)="onSave()">
          Lưu</button
        ><button nz-button nzType="primary" nzDefault (click)="onExist()">
          Thoát
        </button>
      </nz-form-control>
    </div>
  </div>
</form>
